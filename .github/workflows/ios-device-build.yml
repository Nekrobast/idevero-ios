name: Idevero iPhoneOS unsigned device build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-device-build.yml"

permissions:
  contents: read

jobs:
  unsigned-device-build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode and capture environment
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1)"
          test -n "$XCODE_APP"
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          {
            sw_vers
            xcodebuild -version
            swift --version
            xcodebuild -showsdks
          } | tee device-environment.log

      - name: Build unsigned iPhoneOS application
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -project Idevero.xcodeproj \
            -scheme Idevero \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData-Device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee device-xcodebuild.log

      - name: Validate app bundle and ARM64 device product
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="DerivedData-Device/Build/Products/Debug-iphoneos/Idevero.app"
          EXECUTABLE="$APP_PATH/Idevero"
          INFO="$APP_PATH/Info.plist"
          test -d "$APP_PATH"
          test -f "$EXECUTABLE"
          test -f "$INFO"

          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw "$INFO")"
          VERSION="$(plutil -extract CFBundleShortVersionString raw "$INFO")"
          BUILD="$(plutil -extract CFBundleVersion raw "$INFO")"
          MIN_IOS="$(plutil -extract MinimumOSVersion raw "$INFO")"
          ARCHS="$(lipo -archs "$EXECUTABLE")"
          FILE_TYPE="$(file "$EXECUTABLE")"

          test "$BUNDLE_ID" = "com.aitor93.idevero"
          test "$VERSION" = "0.2.2"
          test "$BUILD" = "4"
          echo "$ARCHS" | grep -qw arm64
          echo "$APP_PATH" | grep -q 'Debug-iphoneos'
          ! echo "$APP_PATH" | grep -q 'iphonesimulator'
          xcrun vtool -show-build "$EXECUTABLE" | tee device-platform.log
          grep -Eq 'platform IOS|platform 2' device-platform.log

          test -f "$APP_PATH/Concepts.json"
          test -f "$APP_PATH/Relationships.json"
          test -f "$APP_PATH/DomainPacks.json"
          test -f "$APP_PATH/IntentPacks.json"
          test -f "$APP_PATH/StrategyPacks.json"
          test -f "$APP_PATH/Assets.car"
          test ! -e "$APP_PATH/embedded.mobileprovision"
          test ! -d "$APP_PATH/_CodeSignature"

          {
            echo "BUNDLE_ID=$BUNDLE_ID"
            echo "VERSION=$VERSION"
            echo "BUILD=$BUILD"
            echo "MINIMUM_IOS=$MIN_IOS"
            echo "ARCHITECTURES=$ARCHS"
            echo "EXECUTABLE=$FILE_TYPE"
          } | tee device-bundle.log

      - name: Create and validate unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p DeviceArtifact/Payload
          ditto DerivedData-Device/Build/Products/Debug-iphoneos/Idevero.app DeviceArtifact/Payload/Idevero.app
          cd DeviceArtifact
          /usr/bin/zip -qry Idevero-iOS-0.2.2-DeviceUnsigned.ipa Payload
          unzip -t Idevero-iOS-0.2.2-DeviceUnsigned.ipa | tee ipa-integrity.log
          shasum -a 256 Idevero-iOS-0.2.2-DeviceUnsigned.ipa | tee Idevero-iOS-0.2.2-DeviceUnsigned.ipa.sha256
          test -f Payload/Idevero.app/Info.plist
          test -f Payload/Idevero.app/Idevero
          file Payload/Idevero.app/Idevero | grep -q arm64
          test ! -e Payload/Idevero.app/embedded.mobileprovision
          test ! -d Payload/Idevero.app/_CodeSignature

      - name: Create device build report
        shell: bash
        run: |
          set -euo pipefail
          SHA256="$(cut -d ' ' -f 1 DeviceArtifact/Idevero-iOS-0.2.2-DeviceUnsigned.ipa.sha256)"
          {
            echo '# IDEVERO 0.2.2 build 4 — iPhoneOS unsigned build'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Run: \`$GITHUB_RUN_ID\`"
            echo '- Destination: `generic/platform=iOS`'
            echo '- Product: `Debug-iphoneos/Idevero.app`'
            echo '- Signing: disabled intentionally; AltServer must re-sign'
            echo '- Foundation Models iPhoneOS compile: PASS (app target compiled for iPhoneOS)'
            echo "- SHA-256: \`$SHA256\`"
            echo
            echo '## Environment'
            echo '```text'
            cat device-environment.log
            echo '```'
            echo
            echo '## Bundle'
            echo '```text'
            cat device-bundle.log
            cat device-platform.log
            echo '```'
            echo
            echo '## Result'
            echo '**PASS — unsigned ARM64 iPhoneOS IPA prepared for AltServer re-signing.**'
          } > DeviceArtifact/DEVICE-BUILD-REPORT.md

      - name: Add installation and test guides
        shell: bash
        run: |
          cp WINDOWS-ALTSTORE-DEVICE-TEST.md DeviceArtifact/
          cp WINDOWS-PHYSICAL-TEST-REPORT.md DeviceArtifact/

      - name: Upload private device artifact
        uses: actions/upload-artifact@v4
        with:
          name: idevero-device-build
          path: |
            DeviceArtifact/Idevero-iOS-0.2.2-DeviceUnsigned.ipa
            DeviceArtifact/Idevero-iOS-0.2.2-DeviceUnsigned.ipa.sha256
            DeviceArtifact/DEVICE-BUILD-REPORT.md
            DeviceArtifact/WINDOWS-ALTSTORE-DEVICE-TEST.md
            DeviceArtifact/WINDOWS-PHYSICAL-TEST-REPORT.md
            device-xcodebuild.log
            device-environment.log
          if-no-files-found: error
          retention-days: 7

