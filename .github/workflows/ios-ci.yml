name: Idevero iOS CI
# Release candidate validation: rerun cleanly after runner-allocation failure.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Idevero/**", "IdeveroTests/**", "IdeveroUITests/**", "Idevero.xcodeproj/**", ".github/workflows/ios-ci.yml"]
  pull_request:
    paths: ["Idevero/**", "IdeveroTests/**", "IdeveroUITests/**", "Idevero.xcodeproj/**", ".github/workflows/ios-ci.yml"]

permissions:
  contents: read

env:
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  simulator-build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0

      - name: Audit Physical V6 production additions
        run: node Tools/audit-physical-v6.mjs

      - name: Select installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1)"
          test -n "$XCODE_APP"
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          {
            sw_vers
            xcodebuild -version
            swift --version
            xcodebuild -showsdks
          } | tee simulator-environment.log

      - name: Select large and small iPhone Simulators
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > available-simulators.json
          python3 <<'PY' >> "$GITHUB_ENV"
          import json
          devices = [d for values in json.load(open("available-simulators.json"))["devices"].values() for d in values if d.get("isAvailable") and d["name"].startswith("iPhone")]
          def pick(names, excluded=None):
              for name in names:
                  for device in devices:
                      if device["name"] == name and device["udid"] != excluded:
                          return device
              return next(device for device in devices if device["udid"] != excluded)
          large = pick(["iPhone 17 Pro Max", "iPhone 16 Pro Max", "iPhone 15 Pro Max"])
          small = pick(["iPhone SE (3rd generation)", "iPhone 16e", "iPhone 15", "iPhone 16"], large["udid"])
          print(f'LARGE_SIMULATOR_UDID={large["udid"]}')
          print(f'LARGE_SIMULATOR_NAME={large["name"]}')
          print(f'SMALL_SIMULATOR_UDID={small["udid"]}')
          print(f'SMALL_SIMULATOR_NAME={small["name"]}')
          PY
          cat available-simulators.json

      - name: Build and run complete XCTest suite on large iPhone
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$LARGE_SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$LARGE_SIMULATOR_UDID" -b
          xcodebuild \
            -project Idevero.xcodeproj \
            -scheme Idevero \
            -destination "platform=iOS Simulator,id=$LARGE_SIMULATOR_UDID" \
            -derivedDataPath DerivedData-CI \
            -resultBundlePath TestResults-Large.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            clean test | tee xcodebuild-large.log
          xcrun simctl io "$LARGE_SIMULATOR_UDID" screenshot idevero-large-result.png

      - name: Validate small iPhone with larger Dynamic Type
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          xcrun simctl shutdown "$LARGE_SIMULATOR_UDID" || true
          xcrun simctl boot "$SMALL_SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SMALL_SIMULATOR_UDID" -b
          xcrun simctl ui "$SMALL_SIMULATOR_UDID" content_size accessibility-large
          xcodebuild \
            -project Idevero.xcodeproj \
            -scheme Idevero \
            -destination "platform=iOS Simulator,id=$SMALL_SIMULATOR_UDID" \
            -derivedDataPath DerivedData-CI \
            -resultBundlePath TestResults-Small.xcresult \
            -only-testing:IdeveroUITests/ResponsiveLayoutUITests/testKeyboardDismissesAndGeneratedResultIsReachable \
            CODE_SIGNING_ALLOWED=NO \
            test | tee xcodebuild-small.log
          xcrun simctl io "$SMALL_SIMULATOR_UDID" screenshot idevero-small-dynamic-type.png

      - name: Create UI validation report
        if: always()
        shell: bash
        run: |
          {
            echo '# IDEVERO 0.2.8 build 11 — responsive UI validation'
            echo
            echo "- Commit: \`$SOURCE_COMMIT\`"
            echo "- Run: \`$GITHUB_RUN_ID\`"
            echo "- Large simulator: \`$LARGE_SIMULATOR_NAME\`"
            echo '- Large simulator checks: complete XCTest, software keyboard, generation, keyboard dismissal, result reachability, provider badge'
            echo "- Small simulator: \`$SMALL_SIMULATOR_NAME\`"
            echo '- Small simulator checks: UI test with Accessibility Large Dynamic Type'
            echo '- UI screenshots: XCTest attachments retained in both xcresult bundles'
            echo '- Root behavior: native vertical scroll with interactive keyboard dismissal'
          } > UI-VALIDATION-REPORT.md

      - name: Upload simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idevero-xcode-results-0.2.8
          path: |
            xcodebuild-large.log
            xcodebuild-small.log
            simulator-environment.log
            available-simulators.json
            TestResults-Large.xcresult
            TestResults-Small.xcresult
            idevero-large-result.png
            idevero-small-dynamic-type.png
            UI-VALIDATION-REPORT.md
          if-no-files-found: warn
          retention-days: 7

  unsigned-device-build:
    needs: simulator-build-and-test
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1)"
          test -n "$XCODE_APP"
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          { sw_vers; xcodebuild -version; swift --version; xcodebuild -showsdks; } | tee device-environment.log

      - name: Build unsigned ARM64 iPhoneOS application
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -project Idevero.xcodeproj \
            -scheme Idevero \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData-Device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee device-xcodebuild.log

      - name: Validate bundle and create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="DerivedData-Device/Build/Products/Debug-iphoneos/Idevero.app"
          INFO="$APP/Info.plist"
          EXECUTABLE="$APP/Idevero"
          test -d "$APP" && test -f "$INFO" && test -f "$EXECUTABLE"
          test "$(plutil -extract CFBundleIdentifier raw "$INFO")" = "com.aitor93.idevero"
          test "$(plutil -extract CFBundleShortVersionString raw "$INFO")" = "0.2.8"
          test "$(plutil -extract CFBundleVersion raw "$INFO")" = "11"
          test "$(plutil -extract MinimumOSVersion raw "$INFO")" = "17.0"
          lipo -archs "$EXECUTABLE" | grep -qw arm64
          xcrun vtool -show-build "$EXECUTABLE" | tee device-platform.log
          grep -Eq 'platform IOS|platform 2' device-platform.log
          test ! -e "$APP/embedded.mobileprovision"
          test ! -d "$APP/_CodeSignature"
          test -f "$APP/Concepts.json" && test -f "$APP/Relationships.json"
          test -f "$APP/DomainPacks.json" && test -f "$APP/IntentPacks.json" && test -f "$APP/StrategyPacks.json"
          mkdir -p DeviceArtifact/Payload
          ditto "$APP" DeviceArtifact/Payload/Idevero.app
          cd DeviceArtifact
          /usr/bin/zip -qry Idevero-iOS-0.2.8-DeviceUnsigned.ipa Payload
          unzip -t Idevero-iOS-0.2.8-DeviceUnsigned.ipa | tee ipa-integrity.log
          shasum -a 256 Idevero-iOS-0.2.8-DeviceUnsigned.ipa | tee Idevero-iOS-0.2.8-DeviceUnsigned.ipa.sha256
          cp Idevero-iOS-0.2.8-DeviceUnsigned.ipa.sha256 SHA256SUMS.txt

      - name: Verify re-signability on a disposable copy
        shell: bash
        run: |
          set -euo pipefail
          ditto DeviceArtifact/Payload/Idevero.app DeviceArtifact/Idevero-AdHoc-Test.app
          codesign --force --deep --sign - --timestamp=none DeviceArtifact/Idevero-AdHoc-Test.app
          codesign --verify --deep --strict --verbose=2 DeviceArtifact/Idevero-AdHoc-Test.app
          test ! -d DeviceArtifact/Payload/Idevero.app/_CodeSignature

      - name: Download responsive UI validation evidence
        uses: actions/download-artifact@v4
        with:
          name: idevero-xcode-results-0.2.8
          path: SimulatorEvidence

      - name: Create device build report
        shell: bash
        run: |
          set -euo pipefail
          SHA256="$(cut -d ' ' -f 1 DeviceArtifact/Idevero-iOS-0.2.8-DeviceUnsigned.ipa.sha256)"
          {
            echo '# IDEVERO 0.2.8 build 11 — iPhoneOS unsigned build'
            echo
            echo "- Commit: \`$SOURCE_COMMIT\`"
            echo "- Run: \`$GITHUB_RUN_ID\`"
            echo '- Destination: `generic/platform=iOS`'
            echo '- Architecture: `arm64`'
            echo '- Foundation Models iPhoneOS compile: PASS'
            echo '- Signing: intentionally unsigned; AltServer must re-sign'
            echo '- Disposable-copy structural codesign: PASS'
            echo "- SHA-256: \`$SHA256\`"
          } > DeviceArtifact/DEVICE-BUILD-REPORT.md
          cp SimulatorEvidence/UI-VALIDATION-REPORT.md DeviceArtifact/
          {
            echo '# IDEVERO 0.2.8 build 11 — Xcode CI build'
            echo
            echo "- Commit: \`$SOURCE_COMMIT\`"
            echo "- Run: \`$GITHUB_RUN_ID\`"
            echo '- Simulator build: PASS'
            echo '- Large iPhone UI: PASS'
            echo '- Small iPhone / Accessibility Large UI: PASS'
            echo '- Generic iPhoneOS ARM64 build: PASS'
            echo '- Foundation Models simulator/iPhoneOS compile: PASS'
          } > DeviceArtifact/XCODE-CI-BUILD-REPORT.md
          xcrun xcresulttool get test-results summary --path SimulatorEvidence/TestResults-Large.xcresult > DeviceArtifact/test-summary.json
          {
            echo '# IDEVERO 0.2.8 build 11 — XCTest CI report'
            echo
            echo "- Commit: \`$SOURCE_COMMIT\`"
            echo "- Run: \`$GITHUB_RUN_ID\`"
            echo
            echo '```json'
            cat DeviceArtifact/test-summary.json
            echo '```'
          } > DeviceArtifact/XCTEST-CI-REPORT.md
          cp QUALITY-V5-REPORT.md QUALITY-V4-REPORT.md QUALITY-023-024-025-026.md DeviceArtifact/
          cp PHYSICAL-V6-CHECKLIST.md Tools/VERIFY-IDEVERO-0.2.8.ps1 DeviceArtifact/
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          export IPA_SHA256="$SHA256"
          export SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          python3 <<'PY'
          import json, os
          manifest = {
              "version": "0.2.8", "build": 11, "sourceCommit": os.environ["SOURCE_COMMIT"],
              "sourceTree": os.environ["SOURCE_TREE"], "runID": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"], "ipa": "Idevero-iOS-0.2.8-DeviceUnsigned.ipa",
              "ipaSHA256": os.environ["IPA_SHA256"], "architecture": "arm64", "platform": "iPhoneOS",
              "signing": "unsigned", "physicalQualityV6": "AWAITING IPHONE RETEST"
          }
          with open("DeviceArtifact/manifest.json", "w") as output:
              json.dump(manifest, output, indent=2)
          PY

      - name: Upload private 0.2.8 device artifact
        uses: actions/upload-artifact@v4
        with:
          name: idevero-device-build-0.2.8
          path: |
            DeviceArtifact/Idevero-iOS-0.2.8-DeviceUnsigned.ipa
            DeviceArtifact/Idevero-iOS-0.2.8-DeviceUnsigned.ipa.sha256
            DeviceArtifact/SHA256SUMS.txt
            DeviceArtifact/manifest.json
            PHYSICAL-V6-REMEDIATION.md
            DeviceArtifact/PHYSICAL-V6-CHECKLIST.md
            DeviceArtifact/VERIFY-IDEVERO-0.2.8.ps1
            DeviceArtifact/DEVICE-BUILD-REPORT.md
            DeviceArtifact/UI-VALIDATION-REPORT.md
            DeviceArtifact/QUALITY-V5-REPORT.md
            DeviceArtifact/QUALITY-V4-REPORT.md
            DeviceArtifact/QUALITY-023-024-025-026.md
            DeviceArtifact/XCODE-CI-BUILD-REPORT.md
            DeviceArtifact/XCTEST-CI-REPORT.md
            device-xcodebuild.log
            device-environment.log
            device-platform.log
          if-no-files-found: error
          retention-days: 7

