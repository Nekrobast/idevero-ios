name: Minimal remediation targeted contracts

on:
  workflow_dispatch:
    inputs:
      why-stage:
        description: 'Run Why individual first; suite only after both individual jobs pass'
        required: true
        default: individual
        type: choice
        options: [individual, suite]
  push:
    branches: [pre-1.0-minimal-remediation]

permissions:
  contents: read

jobs:
  targeted-contracts:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[feature-red]') || contains(github.event.head_commit.message, '[targeted-green]') || contains(github.event.head_commit.message, '[support-targeted]') || contains(github.event.head_commit.message, '[why-targeted]') || contains(github.event.head_commit.message, '[why-suite]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: large-normal
            device: iPhone 17 Pro Max
            content-size: large
          - kind: compact-accessibility-large
            device: iPhone 16e
            content-size: accessibility-large
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify authorized diff and guardrail simulations
        run: |
          node Tools/test-authorized-remediation.mjs
          node Tools/audit-authorized-remediation.mjs
      - name: Select installed Xcode and requested iPhone
        env:
          TARGET_DEVICE: ${{ matrix.device }}
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1)"
          test -n "$XCODE_APP"
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun simctl list devices available -j > devices.json
          python3 <<'PY' >> "$GITHUB_ENV"
          import json, os
          devices = [d for rows in json.load(open("devices.json"))["devices"].values() for d in rows if d.get("isAvailable")]
          chosen = next(d for d in devices if d["name"] == os.environ["TARGET_DEVICE"])
          print("SIMULATOR_UDID=" + chosen["udid"])
          print("SIMULATOR_NAME=" + chosen["name"])
          PY
          { sw_vers; xcodebuild -version; swift --version; } > targeted-environment.log
      - name: Boot simulator and apply required Dynamic Type
        shell: bash
        run: |
          set -euo pipefail
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl ui "$SIMULATOR_UDID" content_size "${{ matrix.content-size }}"
      - name: Run native targeted feature contracts
        env:
          WHY_TARGETED: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[why-targeted]') || contains(github.event.head_commit.message, '[why-suite]') }}
          WHY_STAGE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[why-suite]') && 'suite' || inputs.why-stage || 'individual' }}
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          TARGETS=("-only-testing:IdeveroUITests/MinimalComplianceSaveUITests")
          if [ "$WHY_TARGETED" = "true" ]; then
            SELECTOR="IdeveroUITests/PresentationRemediationUITests"
            if [ "$WHY_STAGE" = "individual" ]; then
              SELECTOR="$SELECTOR/testSelectedActionsAndCompactWhyExposeStateWithoutAmbiguity"
            fi
            TARGETS=("-only-testing:$SELECTOR")
          fi
          xcodebuild -project Idevero.xcodeproj -scheme Idevero \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData-Targeted \
            -resultBundlePath FeatureContracts.xcresult \
            "${TARGETS[@]}" clean test | tee targeted-xcodebuild.log
      - name: Retain RED or GREEN native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-remediation-targeted-${{ inputs.why-stage || 'individual' }}-${{ matrix.kind }}-${{ github.sha }}
          path: |
            targeted-xcodebuild.log
            FeatureContracts.xcresult
            devices.json
            targeted-environment.log
          retention-days: 7

  english-generation-diagnostic:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[english-diagnostic]')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify authorized diff and guardrail simulations
        run: |
          node Tools/test-authorized-remediation.mjs
          node Tools/audit-authorized-remediation.mjs
      - name: Select Xcode and exact large simulator
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1)"
          test -n "$XCODE_APP"
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcrun simctl list devices available -j > devices.json
          python3 <<'PY' >> "$GITHUB_ENV"
          import json
          devices = [d for rows in json.load(open('devices.json'))['devices'].values() for d in rows if d.get('isAvailable')]
          chosen = next(d for d in devices if d['name'] == 'iPhone 17 Pro Max')
          print('SIMULATOR_UDID=' + chosen['udid'])
          PY
          { sw_vers; xcodebuild -version; swift --version; } > targeted-environment.log
      - name: Boot exact simulator with normal Dynamic Type
        shell: bash
        run: |
          set -euo pipefail
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl ui "$SIMULATOR_UDID" content_size large
      - name: Run English test exactly once with external diagnostics
        shell: bash
        run: |
          python3 <<'PY'
          import json, os, pathlib, subprocess, threading, time
          evidence = pathlib.Path('EnglishDiagnostic')
          evidence.mkdir()
          timeline = open(evidence / 'observer.jsonl', 'w', buffering=1)
          udid = os.environ['SIMULATOR_UDID']
          def record(event, **values):
              timeline.write(json.dumps(dict(event=event, monotonic=time.monotonic(), **values)) + '\n')
          def capture(name):
              with open(evidence / (name + '-screenshot.log'), 'w') as output:
                  subprocess.run(['xcrun', 'simctl', 'io', udid, 'screenshot', str(evidence / (name + '.png'))], stdout=output, stderr=output)
          def observe():
              try:
                  candidates = subprocess.check_output(['pgrep', '-x', 'Idevero'], text=True).split()
                  if len(candidates) != 1:
                      record('pid-ambiguous', candidates=candidates)
                      return
                  pid = candidates[0]
                  record('tap-observed', pid=pid, alignment='XCTest Tap event precedes event synthesis; not exact generation start')
                  capture('tap-observed')
                  for phase in range(1, 5):
                      with open(evidence / ('sample-' + str(phase) + '.log'), 'w') as output:
                          result = subprocess.run(['/usr/bin/sample', pid, '5', '10', '-file', str(evidence / ('sample-' + str(phase) + '.txt'))], stdout=output, stderr=output)
                      record('sample-finished', phase=phase, returncode=result.returncode)
                      with open(evidence / ('process-' + str(phase) + '.txt'), 'w') as output:
                          subprocess.run(['ps', '-p', pid, '-o', 'pid,etime,time,%cpu,rss,state,command'], stdout=output, stderr=output)
                      capture('after-sample-' + str(phase))
              except Exception as error:
                  record('observer-error', error=repr(error))
          console = open(evidence / 'simulator-console.log', 'w')
          stream = subprocess.Popen(['xcrun', 'simctl', 'spawn', udid, 'log', 'stream', '--style', 'compact', '--level', 'debug', '--predicate', 'process == "Idevero"'], stdout=console, stderr=subprocess.STDOUT)
          command = ['xcodebuild', '-project', 'Idevero.xcodeproj', '-scheme', 'Idevero', '-destination', 'platform=iOS Simulator,id=' + udid, '-derivedDataPath', 'DerivedData-EnglishDiagnostic', '-resultBundlePath', 'FeatureContracts.xcresult', '-only-testing:IdeveroUITests/PresentationRemediationUITests/testEnglishGroupingAndSelectedActionCopy', 'clean', 'test']
          record('command', argv=command, executions=1)
          observer = None
          with open('targeted-xcodebuild.log', 'w', buffering=1) as output:
              process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, bufsize=1)
              for line in process.stdout:
                  output.write(line)
                  print(line, end='', flush=True)
                  if observer is None and 'Tap "keyboardCreatePromptButton" Button' in line:
                      observer = threading.Thread(target=observe)
                      observer.start()
                  if 'Waiting 20.0s for "Generated prompt"' in line or "testEnglishGroupingAndSelectedActionCopy]' passed" in line or "testEnglishGroupingAndSelectedActionCopy]' failed" in line:
                      record('xctest-event', line=line.strip())
              result = process.wait()
          if observer is not None:
              observer.join()
          else:
              record('tap-not-observed')
          stream.terminate()
          stream.wait()
          record('xcodebuild-finished', returncode=result)
          raise SystemExit(result)
          PY
      - name: Retain isolated English diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idevero-isolated-english-diagnostic-${{ github.sha }}
          path: |
            EnglishDiagnostic
            targeted-xcodebuild.log
            FeatureContracts.xcresult
            devices.json
            targeted-environment.log
          retention-days: 7

  english-repro:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[english-repro]')
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify authorized diff and guardrail simulations
        run: |
          node Tools/test-authorized-remediation.mjs
          node Tools/audit-authorized-remediation.mjs
      - name: Select Xcode and exact large simulator
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1)"
          test -n "$XCODE_APP"
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcrun simctl list devices available -j > devices.json
          python3 <<'PY' >> "$GITHUB_ENV"
          import json
          devices = [d for rows in json.load(open('devices.json'))['devices'].values() for d in rows if d.get('isAvailable')]
          chosen = next(d for d in devices if d['name'] == 'iPhone 17 Pro Max')
          print('SIMULATOR_UDID=' + chosen['udid'])
          PY
          { sw_vers; xcodebuild -version; swift --version; } > targeted-environment.log
      - name: Boot exact simulator with normal Dynamic Type
        shell: bash
        run: |
          set -euo pipefail
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl ui "$SIMULATOR_UDID" content_size large
      - name: Run one independent English sample
        id: sample
        shell: bash
        env:
          SAMPLE: ${{ matrix.sample }}
        run: |
          set -uo pipefail
          set +e
          xcodebuild -project Idevero.xcodeproj -scheme Idevero \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "DerivedData-EnglishRepro-$SAMPLE" \
            -resultBundlePath "EnglishRepro-$SAMPLE.xcresult" \
            -only-testing:IdeveroUITests/PresentationRemediationUITests/testEnglishGroupingAndSelectedActionCopy \
            clean test | tee "english-repro-$SAMPLE.log"
          RESULT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$RESULT" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\nsample=%s\nsimulator=iPhone 17 Pro Max\nudid=%s\ncontent_size=large\nxcodebuild_exit=%s\n' "$GITHUB_SHA" "$SAMPLE" "$SIMULATOR_UDID" "$RESULT" > "english-repro-$SAMPLE-metadata.txt"
          exit "$RESULT"
      - name: Retain every sample including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-repro-${{ matrix.sample }}-${{ github.sha }}-exit-${{ steps.sample.outputs.exit_code || 'not-executed' }}
          path: |
            EnglishRepro-${{ matrix.sample }}.xcresult
            english-repro-${{ matrix.sample }}.log
            english-repro-${{ matrix.sample }}-metadata.txt
            devices.json
            targeted-environment.log
          retention-days: 7
